name: Refresh high school scores
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/mississippi-scoreboard]
    paths: ['scoreboard/**', 'tests/scoreboard-integration.test.ts', 'src/broadcast/scoreboard.ts', 'functions/scoreboard/**', '.github/workflows/scoreboard.yml']
permissions:
  contents: write
concurrency:
  group: scoreboard-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:scoreboard
      - name: Read previous snapshot branch
        run: |
          mkdir -p .scoreboard-data
          if git fetch origin scoreboard-data; then
            git show FETCH_HEAD:scoreboard.json > .scoreboard-data/scoreboard.json
          fi
      - name: Collect current games and upcoming schedules
        id: collect
        continue-on-error: true
        run: node scoreboard/scripts/collect.mjs .scoreboard-data/scoreboard.json
      - name: Publish source health and last usable scores
        run: |
          test -s .scoreboard-data/scoreboard.json
          git worktree add --detach /tmp/scoreboard-publish
          cd /tmp/scoreboard-publish
          if git fetch origin scoreboard-data; then
            git checkout -B scoreboard-data FETCH_HEAD
          else
            git checkout --orphan scoreboard-data
            git rm -rf .
          fi
          cp "$GITHUB_WORKSPACE/.scoreboard-data/scoreboard.json" scoreboard.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scoreboard.json
          git diff --cached --quiet || git commit -m '[CF-Pages-Skip] Refresh scoreboard data'
          git push origin HEAD:scoreboard-data
      - name: Report unavailable upstream access
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Current source checks failed; see the source-health panel. Do not treat old scores as live.'
          exit 1
